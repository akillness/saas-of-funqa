[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "funqa-game-log-search"
version = "0.1.0"
description = "CocoIndex v1 game-log retrieval and evidence-bounded Ollama synthesis service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "asyncpg>=0.30,<1",
  "cocoindex[postgres,sentence_transformers]>=1.0.7,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "pgvector>=0.4.1,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
test = ["pytest>=9,<10"]

[project.scripts]
game-log-search = "game_log_search.__main__:main"
game-log-search-fixtures = "game_log_search.fixture_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["game_log_search*"]
