name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-apphosting-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Firebase App Hosting
    runs-on: ubuntu-latest
    needs: []

    env:
      BACKEND_ID: saas-of-funqa
      PROJECT_ID: saas-of-funqa
      APP_HOSTING_URL: https://saas-of-funqa--saas-of-funqa.us-east4.hosted.app
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      PORT: 4300
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
      SECRET_ENCRYPTION_KEY_VERSION: v1
      FUNCTIONS_ADMIN_EMAILS: ${{ vars.FUNCTIONS_ADMIN_EMAILS }}
      # Functions 런타임 모델은 scripts/build-functions.mjs 가 고정하므로 이 값은
      # Functions 에 도달하지 않는다. 로컬/빌드 단계 일관성용으로만 유지.
      EMBEDDING_MODEL_ID: gemini-embedding-2
      EMBEDDING_OUTPUT_DIMENSION: 1536
      RAG_LIVE_EMBEDDINGS: 1
      SEARCH_TOP_K: 5
      RAG_STORE_PATH: ./.runtime/rag-store.json
      APPHOSTING_DEPLOY_MAX_ATTEMPTS: 6
      APPHOSTING_DEPLOY_RETRY_SECONDS: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with App Hosting npm
        run: npx -y npm@10.9.3 ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build:web

      - name: Deploy Firebase Functions and App Hosting
        run: |
          set +e
          timeout 600 ./deploy.sh
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          if [ "$status" -eq 124 ]; then
            echo "firebase deploy timed out while waiting for rollout completion; continuing to hosted verification"
          fi

      - name: Verify hosted app responds
        run: |
          for attempt in {1..18}; do
            status="$(curl -sS -o /tmp/funqa-home.html -w '%{http_code}' "$APP_HOSTING_URL/search?lang=ko" || true)"
            if [ "$status" = "200" ] && grep -q 'locale-switcher' /tmp/funqa-home.html && grep -q 'funqa' /tmp/funqa-home.html; then
              echo "Hosted app responded with HTTP 200 and served the search UI"
              exit 0
            fi
            echo "Attempt $attempt: status=$status"
            sleep 10
          done
          echo "Hosted app did not serve the search UI in time"
          exit 1

      - name: Verify live API readiness
        run: |
          # Exact model selection is a startup invariant in validateConfig();
          # public health intentionally exposes only liveness, not admin runtime details.
          for attempt in {1..18}; do
            payload="$(curl -sS https://asia-northeast3-saas-of-funqa.cloudfunctions.net/api/v1/health || true)"
            actual="$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
            if [ "$actual" = "ok" ]; then
              echo "Live API reports status=ok"
              exit 0
            fi
            echo "Attempt $attempt: status=${actual:-<unavailable>}"
            sleep 10
          done
          echo "Live API did not report status=ok in time"
          exit 1
