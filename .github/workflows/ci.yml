name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with App Hosting npm
        run: npx -y npm@10.9.3 ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Verify scene scenario manifest
        run: npm run verify:scene-scenarios

      - name: Smoke test deterministic RAG
        run: npm run smoke:rag

      - name: Build Functions bundle
        run: npm run build:functions

      - name: Build web app
        run: npm run build:web
