runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_APP_NAME
    value: funqa
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://asia-northeast3-saas-of-funqa.cloudfunctions.net/api
    availability:
      - BUILD
      - RUNTIME
  - variable: GAME_LOG_SEARCH_ENGINE
    value: genkit
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_MODEL_ID
    value: gemini-2.5-flash
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
